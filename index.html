<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OE — Oriental Essence</title>
<meta name="description" content="OE 品牌 · 运动鞋履选购与内容入口合集">
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230b0b0d'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23e8ff4d' font-family='sans-serif' font-weight='bold'>OE</text></svg>">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Inter,system-ui,sans-serif;
    background:var(--bg); color:var(--fg);
    min-height:100dvh; line-height:1.6;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
    transition:background .3s, color .3s;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(700px 380px at 50% -8%, var(--glow1), transparent 70%),
      radial-gradient(520px 320px at 12% 22%, var(--glow2), transparent 70%),
      radial-gradient(600px 400px at 92% 78%, var(--glow3), transparent 70%),
      linear-gradient(180deg,var(--bg),var(--bg2));
  }
  :root{
    --fg:#f4f4f5; --fg-2:#a1a1aa;
    --card:rgba(255,255,255,.045);
    --card-hover:rgba(255,255,255,.085);
    --line:rgba(255,255,255,.10);
    --line2:rgba(255,255,255,.055);
    --d4:#d4d4d8;
    --max:520px; --r:18px; --fs:1;
    --glow1:rgba(124,92,255,.30);
    --glow2:rgba(232,255,77,.10);
    --glow3:rgba(255,80,140,.10);
  }
  .wrap{max-width:var(--max);margin:0 auto;padding:40px 20px 72px;font-size:calc(16px * var(--fs))}

  .avatar{
    width:88px;height:88px;margin:0 auto 18px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;overflow:hidden;
    font:800 30px/1 "Segoe UI",system-ui;color:#0b0b0d;letter-spacing:-1px;
    box-shadow:0 10px 40px var(--shadow);
  }
  .avatar img{width:100%;height:100%;object-fit:cover}
  h1{font-size:1.5em;font-weight:800;letter-spacing:-.4px;text-align:center}
  .handle{text-align:center;color:var(--fg-2);font-size:.875em;margin-top:4px}
  .tagline{
    text-align:center;margin-top:14px;font-size:.91em;color:var(--d4);
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:12px 16px;white-space:pre-wrap;
  }
  .badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  .badge{font-size:.72em;letter-spacing:.4px;padding:5px 11px;border-radius:999px;
    background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent)}

  .socials{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:22px 0 6px}
  .socials a{
    width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
    background:var(--card);border:1px solid var(--line);color:var(--fg);
    transition:.22s cubic-bezier(.2,.8,.3,1);
  }
  .socials a:hover{background:var(--card-hover);transform:translateY(-3px);border-color:var(--accent-line)}
  .socials svg{width:20px;height:20px;fill:currentColor}

  section{margin-top:30px}
  .sec-title{
    font-size:.72em;letter-spacing:2px;text-transform:uppercase;
    color:var(--fg-2);margin-bottom:12px;padding-left:2px;
    display:flex;align-items:center;gap:8px;
  }
  .sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  .links{display:flex;flex-direction:column;gap:10px}
  .link{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:15px 16px;transition:.22s cubic-bezier(.2,.8,.3,1);position:relative;overflow:hidden;
  }
  .link::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--accent),var(--accent2));opacity:0;transition:.22s}
  .link:hover{background:var(--card-hover);transform:translateY(-2px);border-color:rgba(127,127,127,.35)}
  .link:hover::before{opacity:1}
  .link .ic{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;
    background:var(--icbg);border:1px solid var(--line)}
  .link .ic svg{width:19px;height:19px;fill:var(--ictx)}
  .link .meta{flex:1;min-width:0}
  .link .t{font-weight:650;font-size:.94em;letter-spacing:-.1px;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
  .link .s{font-size:.78em;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .link .arrow{color:var(--fg-2);flex:0 0 auto;transition:.22s}
  .link:hover .arrow{color:var(--accent);transform:translateX(3px)}
  .link .arrow svg{width:16px;height:16px;fill:currentColor}
  .link.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:var(--onaccent)}
  .link.primary .s,.link.primary .arrow{color:var(--onaccent-sub)}
  .link.primary .ic{background:var(--onaccent-icbg);border-color:transparent}
  .link.primary .ic svg{fill:var(--onaccent)}
  .link.primary::before{display:none}
  .link.primary:hover{box-shadow:0 12px 34px var(--shadow)}
  .pill{font-size:.66em;letter-spacing:.5px;padding:3px 8px;border-radius:999px;
    background:var(--accent2-soft);border:1px solid var(--accent2-line);color:var(--accent2-tx);white-space:nowrap}

  .tablewrap{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
  .tscroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.85em}
  thead th{text-align:left;font-size:.72em;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--fg-2);padding:11px 14px;background:var(--thead);font-weight:600;
    border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:10px 14px;border-bottom:1px solid var(--line2);white-space:nowrap}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--trhover)}
  td.num{font-variant-numeric:tabular-nums}
  .up{color:#f87171}
  .down{color:#4ade80}

  .codebox{display:flex;align-items:center;gap:10px;justify-content:space-between;
    border:1px dashed var(--accent-line);border-radius:var(--r);
    background:var(--accent-soft);padding:14px 16px}
  .codebox .k{font-size:.75em;color:var(--fg-2);letter-spacing:.6px}
  .codebox .v{font:700 1.06em/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:var(--accent);letter-spacing:2px;margin-top:2px;word-break:break-all}
  .copy{flex:0 0 auto;border:1px solid var(--accent-line);background:var(--accent-soft);
    color:var(--accent);border-radius:10px;padding:8px 12px;font-size:.78em;font-weight:600;cursor:pointer;
    font-family:inherit;transition:.2s}
  .copy:hover{background:var(--accent-hover)}

  .textblock{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:15px 16px;font-size:.9em;white-space:pre-wrap;color:var(--d4)}

  footer{margin-top:40px;text-align:center;color:var(--fg-2);font-size:.8em;line-height:1.9}
  footer .dot{opacity:.5}
  .totop{display:inline-block;margin-top:6px;color:var(--fg-2);text-decoration:none;
    border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:.95em}
  .totop:hover{color:var(--accent);border-color:var(--accent-line)}

  .state{max-width:var(--max);margin:0 auto;padding:80px 20px;text-align:center;color:var(--fg-2)}
  .state h2{color:var(--fg);font-size:1.2em;margin-bottom:10px}
  .state code{display:inline-block;margin-top:14px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:10px 14px;font-size:.8em;color:var(--accent);word-break:break-all}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:380px){.link{padding:13px}.wrap{padding:32px 16px 60px}}
</style>
</head>
<body>

<div id="app"><div class="state"><p>加载中…</p></div></div>

<script src="assets/icons.js"></script>
<script>
(function () {
  var DATA_URL = 'data/site.json';
  var ICONS = window.OE_ICONS || {};
  var app = document.getElementById('app');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function icon(name) {
    var p = ICONS[name] || ICONS.link;
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' + p + '</svg>';
  }
  // 仅允许安全协议，挡掉 javascript: 之类
  function safeUrl(u) {
    u = String(u == null ? '' : u).trim();
    if (!u) return '';
    if (/^(https?:|mailto:|tel:)/i.test(u)) return u;
    if (/^[\w.-]+\.[a-z]{2,}/i.test(u)) return 'https://' + u;
    return '';
  }
  function hexToRgb(hex) {
    hex = String(hex || '').replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(function (c) { return c + c; }).join('');
    if (!/^[0-9a-fA-F]{6}$/.test(hex)) return null;
    var n = parseInt(hex, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }
  function rgba(hex, a) {
    var c = hexToRgb(hex);
    return c ? 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + a + ')' : 'rgba(124,92,255,' + a + ')';
  }
  function lum(hex) {
    var c = hexToRgb(hex);
    if (!c) return 0;
    return (0.299 * c.r + 0.587 * c.g + 0.114 * c.b) / 255;
  }
  function isLight(hex) { return lum(hex) > 0.6; }
  function deltaClass(v) {
    v = String(v == null ? '' : v).trim();
    if (v === '↑' || v === '+') return 'up';
    if (v === '↓' || v === '-') return 'down';
    return '';
  }

  function applyTheme(t) {
    t = t || {};
    var accent = t.accent || '#e8ff4d';
    var accent2 = t.accent2 || '#7c5cff';
    var bg = t.bg || '#0b0b0d';
    var light = isLight(bg);
    var a2light = isLight(accent2);
    var rs = document.documentElement.style;

    rs.setProperty('--bg', bg);
    rs.setProperty('--bg2', t.bg2 || (light ? '#f2f2f5' : '#121216'));
    rs.setProperty('--accent', accent);
    rs.setProperty('--accent2', accent2);

    rs.setProperty('--accent-soft', rgba(accent, light ? .16 : .10));
    rs.setProperty('--accent-hover', rgba(accent, light ? .28 : .20));
    rs.setProperty('--accent-line', rgba(accent, light ? .45 : .32));
    rs.setProperty('--accent2-soft', rgba(accent2, a2light ? .16 : .18));
    rs.setProperty('--accent2-line', rgba(accent2, a2light ? .5 : .42));
    rs.setProperty('--accent2-tx', a2light ? '#3b2a7a' : '#c4b5fd');

    rs.setProperty('--shadow', rgba(accent2, .35));
    rs.setProperty('--glow1', rgba(accent2, .30));
    rs.setProperty('--glow2', rgba(accent, light ? .20 : .10));
    rs.setProperty('--glow3', rgba(accent2, light ? .14 : .10));

    rs.setProperty('--card', light ? 'rgba(0,0,0,.045)' : 'rgba(255,255,255,.045)');
    rs.setProperty('--card-hover', light ? 'rgba(0,0,0,.075)' : 'rgba(255,255,255,.085)');
    rs.setProperty('--line', light ? 'rgba(0,0,0,.11)' : 'rgba(255,255,255,.10)');
    rs.setProperty('--line2', light ? 'rgba(0,0,0,.07)' : 'rgba(255,255,255,.055)');
    rs.setProperty('--thead', light ? 'rgba(0,0,0,.035)' : 'rgba(255,255,255,.035)');
    rs.setProperty('--trhover', light ? 'rgba(0,0,0,.03)' : 'rgba(255,255,255,.03)');
    rs.setProperty('--icbg', light ? 'rgba(0,0,0,.05)' : 'rgba(255,255,255,.06)');
    rs.setProperty('--ictx', light ? '#3f3f46' : '#d4d4d8');

    rs.setProperty('--fg', light ? '#18181b' : '#f4f4f5');
    rs.setProperty('--fg-2', light ? '#5b5b66' : '#a1a1aa');
    rs.setProperty('--d4', light ? '#27272a' : '#d4d4d8');

    // 主按钮上的文字色：按底色亮度自动选黑/白
    var onAcc = (lum(accent) + lum(accent2)) / 2 > 0.55 ? '#0b0b0d' : '#ffffff';
    rs.setProperty('--onaccent', onAcc);
    rs.setProperty('--onaccent-sub', onAcc === '#ffffff' ? 'rgba(255,255,255,.68)' : 'rgba(11,11,13,.62)');
    rs.setProperty('--onaccent-icbg', onAcc === '#ffffff' ? 'rgba(255,255,255,.14)' : 'rgba(11,11,13,.10)');

    rs.setProperty('--r', (t.radius || 18) + 'px');
    rs.setProperty('--fs', String(t.fontScale || 1));

    var tc = document.querySelector('meta[name=theme-color]');
    if (tc) tc.setAttribute('content', bg);
  }

  function renderSocials(list) {
    if (!list || !list.length) return '';
    var h = '<div class="socials">';
    list.forEach(function (s) {
      var u = safeUrl(s.url);
      if (!u) return;
      h += '<a href="' + esc(u) + '" title="' + esc(s.label || '') + '" aria-label="' + esc(s.label || 'link') + '"' +
           ' target="_blank" rel="noopener noreferrer">' + icon(s.icon) + '</a>';
    });
    return h + '</div>';
  }

  function renderLinkItem(it) {
    var u = safeUrl(it.url);
    var h = '<a class="link' + (it.style === 'primary' ? ' primary' : '') + '" href="' + esc(u) + '"' +
           ' target="_blank" rel="noopener noreferrer">' +
           '<span class="ic">' + icon(it.icon) + '</span><span class="meta">' +
           '<span class="t">' + esc(it.title || '未命名');
    if (it.badge) h += '<span class="pill">' + esc(it.badge) + '</span>';
    h += '</span>';
    if (it.subtitle) h += '<span class="s">' + esc(it.subtitle) + '</span>';
    h += '</span><span class="arrow">' +
         '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6-1.4-1.4L12.2 12 7.6 7.4 9 6Z"/></svg>' +
         '</span></a>';
    return h;
  }

  function renderSection(sec) {
    if (!sec || sec.enabled === false) return '';
    var h = '<section>';
    if (sec.title) h += '<div class="sec-title">' + esc(sec.title) + '</div>';

    if (sec.type === 'links') {
      var items = (sec.items || []).filter(function (x) { return x.enabled !== false; });
      if (!items.length) return '';
      h += '<div class="links">' + items.map(renderLinkItem).join('') + '</div>';

    } else if (sec.type === 'code') {
      if (!sec.value) return '';
      h += '<div class="codebox"><div><div class="k">' + esc(sec.label || '邀请码') + '</div>' +
           '<div class="v" data-code="' + esc(sec.value) + '">' + esc(sec.value) + '</div></div>' +
           '<button class="copy" type="button">复制</button></div>';

    } else if (sec.type === 'table') {
      var cols = sec.columns || [], rows = sec.rows || [];
      if (!cols.length || !rows.length) return '';
      h += '<div class="tablewrap"><div class="tscroll"><table><thead><tr>' +
           cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') +
           '</tr></thead><tbody>';
      rows.forEach(function (r) {
        h += '<tr>' + r.map(function (c, i) {
          var dc = (r.length > 2 && i === r.length - 1) ? deltaClass(c) : '';
          return '<td class="num' + (dc ? ' ' + dc : '') + '">' + esc(c) + '</td>';
        }).join('') + '</tr>';
      });
      h += '</tbody></table></div></div>';

    } else if (sec.type === 'text') {
      if (!sec.body) return '';
      h += '<div class="textblock">' + esc(sec.body) + '</div>';

    } else { return ''; }
    return h + '</section>';
  }

  function render(d) {
    applyTheme(d.theme);
    var p = d.profile || {}, s = d.site || {};

    var av = p.avatarUrl
      ? '<div class="avatar"><img src="' + esc(safeUrl(p.avatarUrl)) + '" alt="" referrerpolicy="no-referrer"></div>'
      : '<div class="avatar">' + esc(p.avatarText || 'OE') + '</div>';

    var badges = (p.badges || []).filter(Boolean);
    var html = '<div class="wrap">' + av;
    if (p.name) html += '<h1>' + esc(p.name) + '</h1>';
    if (p.handle) html += '<div class="handle">' + esc(p.handle) + '</div>';
    if (p.bio) html += '<p class="tagline">' + esc(p.bio) + '</p>';
    if (badges.length) {
      html += '<div class="badges">' + badges.map(function (b) {
        return '<span class="badge">' + esc(b) + '</span>';
      }).join('') + '</div>';
    }
    html += renderSocials(d.socials);
    html += (d.sections || []).map(renderSection).join('');
    html += '<footer><div>' + esc(s.footer || '') + '</div><div class="dot">—</div>' +
            '<div>' + esc(s.footerNote || '') + '</div>' +
            '<a class="totop" href="#">回到顶部 ↑</a></footer></div>';

    app.innerHTML = html;
    document.title = s.title || 'OE';
    var md = document.querySelector('meta[name=description]');
    if (md && s.description) md.setAttribute('content', s.description);

    bindCopy();
  }

  function bindCopy() {
    function legacy(code, done) {
      var ta = document.createElement('textarea');
      ta.value = code;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
    Array.prototype.forEach.call(document.querySelectorAll('.copy'), function (btn) {
      btn.addEventListener('click', function () {
        var box = btn.closest('.codebox');
        var el = box && box.querySelector('[data-code]');
        var code = el ? el.getAttribute('data-code') : '';
        if (!code) return;
        var old = btn.textContent;
        var done = function () {
          btn.textContent = '已复制';
          setTimeout(function () { btn.textContent = old; }, 1600);
        };
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(code).then(done, function () { legacy(code, done); });
        } else { legacy(code, done); }
      });
    });
  }

  function fail(title, msg, extra) {
    app.innerHTML = '<div class="state"><h2>' + esc(title) + '</h2><p>' + esc(msg) + '</p>' +
      (extra ? '<code>' + esc(extra) + '</code>' : '') + '</div>';
  }

  fetch(DATA_URL, { cache: 'no-cache' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(render)
    .catch(function (e) {
      fail('数据加载失败', '请检查 data/site.json 是否存在且为合法 JSON。', String(e.message || e));
    });
})();
</script>
</body>
</html>
